name: Deploy to FC3 (Reusable)

"on":
  workflow_call:
    inputs:
      function_name:
        required: true
        type: string
      custom_domain:
        required: true
        type: string
      cert_name:
        required: true
        type: string
    secrets:
      FC_DEPLOY_ROLE_ARN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo input
        run: |
          echo "function=${{ inputs.function_name }}"
          echo "domain=${{ inputs.custom_domain }}"
          echo "cert=${{ inputs.cert_name }}"

      - name: Call composite action
        uses: daifuyang/.github/actions/fc-deploy-env@main
        with:
          role-arn: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
