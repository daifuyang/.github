name: Deploy to FC3 (Reusable)

"on":
  workflow_call:
    inputs:
      function_name:
        required: true
        type: string
    secrets:
      FC_DEPLOY_ROLE_ARN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo input
        run: echo "function=${{ inputs.function_name }}"
